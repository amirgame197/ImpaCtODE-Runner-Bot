name: Copy latest release assets to draft

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Copy assets into the newest draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          source_release="$(gh api "repos/$REPOSITORY/releases/latest")"
          source_tag="$(jq -r '.tag_name' <<< "$source_release")"
          source_asset_count="$(jq '.assets | length' <<< "$source_release")"

          target_release="$(gh api "repos/$REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.draft)] | sort_by(.created_at) | last // empty')"

          if [[ -z "$target_release" ]]; then
            echo "No draft release was found."
            exit 1
          fi

          target_id="$(jq -r '.id' <<< "$target_release")"
          target_name="$(jq -r '.name // .tag_name' <<< "$target_release")"
          upload_url="$(jq -r '.upload_url' <<< "$target_release" | sed 's/{?name,label}//')"
          target_assets_url="repos/$REPOSITORY/releases/$target_id/assets?per_page=100"

          echo "Source: $source_tag ($source_asset_count assets)"
          echo "Target: $target_name (draft release $target_id)"

          if [[ "$source_asset_count" == "0" ]]; then
            echo "The latest release has no assets."
            exit 0
          fi

          asset_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$asset_dir"
          gh release download "$source_tag" \
            --repo "$REPOSITORY" \
            --dir "$asset_dir" \
            --clobber

          while IFS= read -r asset; do
            asset_name="$(basename "$asset")"
            encoded_name="$(jq -rn --arg name "$asset_name" '$name | @uri')"

            existing_id="$(gh api "$target_assets_url" \
              | jq -r --arg name "$asset_name" '.[] | select(.name == $name) | .id' \
              | head -n 1)"
            if [[ -n "$existing_id" ]]; then
              gh api --method DELETE \
                "repos/$REPOSITORY/releases/assets/$existing_id"
            fi

            content_type="$(file --brief --mime-type "$asset")"
            gh api --method POST \
              --input "$asset" \
              -H "Content-Type: $content_type" \
              "$upload_url?name=$encoded_name" >/dev/null
            echo "Uploaded $asset_name"
          done < <(find "$asset_dir" -maxdepth 1 -type f -print)

          gh api --method PATCH "repos/$REPOSITORY/releases/$target_id" \
            -F draft=true >/dev/null
          echo "Draft release saved: $target_name"